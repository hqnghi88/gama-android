name: Auto-Create Release

# Pushing a version tag (e.g. v0.1.40) creates and publishes a GitHub Release
# automatically, then builds the APK and attaches it to that release.
on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          CT=$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$CT" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            CT="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $CT"
          yes | "$CT" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CT" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache GAMA deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: native-app/app/libs
          key: gama-deps-${{ hashFiles('native-app/app/build.gradle') }}
          restore-keys: gama-deps-

      - name: Download GAMA dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 \
            "https://github.com/${{ github.repository }}/releases/download/native-app-deps/native-app-deps.tar.gz" \
            -o /tmp/native-app-deps.tar.gz
          tar -xzf /tmp/native-app-deps.tar.gz -C native-app/
          rm /tmp/native-app-deps.tar.gz

      - name: Verify libs
        run: |
          COUNT=$(ls native-app/app/libs/pristine/*.jar 2>/dev/null | wc -l)
          echo "Pristine jars: $COUNT"
          if [ "$COUNT" -lt 30 ]; then
            echo "ERROR: incomplete deps bundle"
            exit 1
          fi

      - name: Patch GAMA jars
        working-directory: native-app
        run: ./gradlew --no-daemon app:patchGamaJars

      - name: Build APK
        working-directory: native-app
        run: ./gradlew --no-daemon app:assembleDebug

      # Create the release from the pushed tag (tag-based, so the version string
      # matches). Use the tag as the release name; an untagged draft would instead
      # be created from the default branch.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            native-app/app/build/outputs/apk/debug/app-debug.apk
