plugins {
    id 'com.android.application'
}

// Patch jars for Android:
//  1. Downgrade class file versions > 65 (produced by JDK 25) down to 65 so AGP 8.5.2's
//     D8 and the JDK 21 javac can read the new GAMA jars.
//  2. Strip classes that break D8.
//  3. Compile AndroidTaskWrapper (replaces ForkJoinTask.join() on Android).
//  4. Run ASM patchers for Android-specific runtime fixes (each fail-soft).
tasks.register('patchGamaJars') {
    doLast {
        def libsDir = file("$buildDir/../../app/libs")

        // Run a command, logging a warning instead of failing the build when it errors.
        def safeExec = { String label, Closure spec ->
            try {
                exec(spec)
                logger.lifecycle("${label}: OK")
            } catch (Exception e) {
                logger.warn("${label} failed (continuing): ${e.message}")
            }
        }

        // 1) Rewrite class file versions > 65 (JDK 21) down to 65, and clear any preview
        //    (minor version 0xFFFF) flag, so D8/javac can read the jars.
        def maxClassVersion = 65
        fileTree(libsDir).matching { include '*.jar' }.each { jarFile ->
            def tmpJar = new File(jarFile.absolutePath + '.revert')
            boolean changed = false
            def zin = new java.util.jar.JarFile(jarFile)
            def zout = new java.util.jar.JarOutputStream(new FileOutputStream(tmpJar))
            def entries = zin.entries()
            while (entries.hasMoreElements()) {
                def e = entries.nextElement()
                def outEntry = new java.util.jar.JarEntry(e.name)
                zout.putNextEntry(outEntry)
                byte[] bytes = new byte[0]
                if (!e.isDirectory()) {
                    def is = zin.getInputStream(e)
                    bytes = is.bytes
                    is.close()
                }
                if (!e.isDirectory() && e.name.endsWith('.class') && bytes.length > 8) {
                    int minor = ((bytes[4] & 0xFF) << 8) | (bytes[5] & 0xFF)
                    int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
                    if (minor == 0xFFFF) { bytes[4] = 0; bytes[5] = 0; changed = true }
                    if (major > maxClassVersion) {
                        bytes[6] = (maxClassVersion >> 8) & 0xFF
                        bytes[7] = maxClassVersion & 0xFF
                        changed = true
                    }
                }
                zout.write(bytes)
                zout.closeEntry()
            }
            zin.close()
            zout.close()
            if (changed) {
                jarFile.delete()
                tmpJar.renameTo(jarFile)
                logger.lifecycle("Downgraded class versions in ${jarFile.name}")
            } else {
                tmpJar.delete()
            }
        }

        // 2) Strip classes that break D8 on Android.
        def patchedClasses = ['gama/gaml/descriptions/SkillDescription.class']
        fileTree(libsDir).matching { include '*.jar' }.each { jarFile ->
            def tmpDir = file("$buildDir/tmp/jar_patch/${jarFile.name}")
            tmpDir.mkdirs()
            exec {
                commandLine 'jar', 'xf', jarFile.absolutePath
                workingDir tmpDir
            }
            def removed = false
            patchedClasses.each { cls ->
                def f = file("${tmpDir}/${cls}")
                if (f.exists()) { f.delete(); removed = true }
            }
            if (removed) {
                exec {
                    commandLine 'jar', 'cf', jarFile.absolutePath, '-C', tmpDir, '.'
                }
                logger.lifecycle("Patched JAR: ${jarFile.name}")
            }
            tmpDir.deleteDir()
        }

        // 3) Compile AndroidTaskWrapper (in package gama.api.runtime).
        def wrapperOutDir = file("$buildDir/tmp/android_wrapper")
        wrapperOutDir.mkdirs()
        safeExec('Compile AndroidTaskWrapper', {
            commandLine 'javac', '--release', '21',
                '-cp', "${libsDir}/gama.api_0.0.0.202608091252.jar",
                '-d', wrapperOutDir.absolutePath,
                "${projectDir}/../tools/AndroidTaskWrapper.java"
        })

        // 4) ASM patchers: compile each, then run it, never failing the build.
        def asmJar = fileTree("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/org.ow2.asm/asm/9.6")
            .matching { include '**/*.jar' }.files.first()
        def asmTreeJar = fileTree("${System.getProperty('user.home')}/.gradle/caches/modules-2/files-2.1/org.ow2.asm/asm-tree/9.6")
            .matching { include '**/*.jar' }.files.first()

        def gamaApiJar = "${libsDir}/gama.api_0.0.0.202608091252.jar"
        def gamaCoreJar = "${libsDir}/gama.core_0.0.0.202608091252.jar"

        def patchers = [
            ['ParallelRunnerPatcher', 'ParallelRunnerPatcher',
                [gamaApiJar, "${wrapperOutDir.absolutePath}/gama/api/runtime/AndroidTaskWrapper.class"]],
            ['Display3DPatcher', 'Display3DPatcher', [gamaCoreJar]],
            ['TypeSwitchPatcher', 'TypeSwitchPatcher',
                [gamaCoreJar,
                 "${libsDir}/gama.extension.image_0.0.0.202608091252.jar",
                 "${libsDir}/gama.extension.network_0.0.0.202608091252.jar",
                 "${libsDir}/gama.ui.experiment_0.0.0.202608091252.jar",
                 "${libsDir}/gama.ui.shared_0.0.0.202608091252.jar",
                 "${libsDir}/gama.ui.viewers_0.0.0.202608091252.jar"]],
            ['CrsPatcher', 'CrsPatcher', [gamaCoreJar]],
            ['ColorsPatcher', 'ColorsPatcher', [gamaCoreJar]],
            ['SimulationRunnerPatcher', 'SimulationRunnerPatcher', [gamaApiJar]],
            ['MeshLayerPatcher', 'MeshLayerPatcher', [gamaCoreJar]],
            ['LayerManagerPatcher', 'LayerManagerPatcher', [gamaCoreJar]],
            ['ImageLayerPatcher', 'ImageLayerPatcher', [gamaCoreJar]],
            ['CacheBuilderPatcher', 'CacheBuilderPatcher', [gamaCoreJar]],
            ['SpiPatcher', 'SpiPatcher', ["${libsDir}/gt-referencing-25.0.jar"]],
            ['ProjectionPatcher', 'ProjectionPatcher', [gamaCoreJar]],
            ['MapProjectionPatcher', 'MapProjectionPatcher', ["${libsDir}/gt-referencing-25.0.jar"]],
            ['EclipseCorePatcher', 'EclipseCorePatcher',
                ["${libsDir}/eclipse-core-stubs.jar", gamaCoreJar]]
        ]
        patchers.each { name, cls, args ->
            def outDir = file("$buildDir/tmp/patch_$name")
            outDir.mkdirs()
            safeExec("Compile $name", {
                commandLine 'javac', '--release', '21',
                    '-cp', "${asmJar.absolutePath}:${asmTreeJar.absolutePath}",
                    '-d', outDir.absolutePath,
                    "${projectDir}/../tools/${name}.java"
            })
            safeExec("Run $name", {
                commandLine(['java', '-cp',
                    "${outDir.absolutePath}:${asmJar.absolutePath}:${asmTreeJar.absolutePath}",
                    cls] + args)
            })
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) {
        task.dependsOn 'patchGamaJars'
    }
    if (task.name == 'compileDebugJavaWithJavac' || task.name == 'compileReleaseJavaWithJavac') {
        task.dependsOn 'patchGamaJars'
        task.options.compilerArgs += ['-Xmaxerrs', '2000']
    }
}

def keystoreProperties = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.gama.nativeapp'
    compileSdk 34

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.gama.nativeapp"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "0.1.11"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['about.ini', 'about.mappings', 'about.properties', 'plugin.xml', 'plugin.properties',
                         'modeling32.png', 'lib/native/**', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/README*',
                         'META-INF/*.DSA', 'META-INF/*.SF', 'META-INF/*.RSA',
                         '*.exsd', 'schema/*.exsd',
                         '*.namespaces', '*.imports', '*.extensions', '*.launch', '*.target']
            pickFirsts += ['META-INF/MANIFEST.MF']
        }
        jniLibs {
            excludes += ['**']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'com.google.inject:guice:5.1.0'
        force 'aopalliance:aopalliance:1.0'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['gama.extension.physics*', '*.original.jar'])

    implementation 'org.locationtech.jts:jts-core:1.19.0'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'org.jfree:jfreechart:1.5.4'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    implementation 'org.locationtech.jts:jts-io:1.19.0'
    implementation 'com.google.guava:guava:33.2.1-jre'
    implementation 'one.util:streamex:0.8.3'
    implementation 'org.apache.commons:commons-math3:3.6.1'

    implementation files('libs/guice-5.1.0-patched.jar')
    implementation 'javax.inject:javax.inject:1'
    implementation 'aopalliance:aopalliance:1.0'

    implementation('org.eclipse.xtext:org.eclipse.xtext:2.35.0') {
        exclude group: 'org.eclipse.platform'
        exclude group: 'org.ow2.asm'
        exclude group: 'ch.qos.reload4j'
        exclude group: 'com.google.inject'
        exclude group: 'aopalliance'
    }
    implementation('org.eclipse.xtext:org.eclipse.xtext.xbase:2.35.0') {
        exclude group: 'org.eclipse.platform'
        exclude group: 'org.ow2.asm'
        exclude group: 'com.google.inject'
    }
    implementation('org.eclipse.xtext:org.eclipse.xtext.util:2.35.0') {
        exclude group: 'org.eclipse.platform'
        exclude group: 'com.google.inject'
    }
    implementation('org.eclipse.xtend:org.eclipse.xtend.lib:2.35.0') {
        exclude group: 'org.eclipse.platform'
        exclude group: 'com.google.inject'
    }
    implementation('org.eclipse.emf:org.eclipse.emf.ecore:2.31.0') {
        exclude group: 'org.eclipse.platform'
    }
    implementation('org.eclipse.emf:org.eclipse.emf.common:2.31.0') {
        exclude group: 'org.eclipse.platform'
    }
    implementation('org.eclipse.emf:org.eclipse.emf.ecore.xmi:2.18.0') {
        exclude group: 'org.eclipse.platform'
    }

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
